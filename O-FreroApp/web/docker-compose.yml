services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofrero
      POSTGRES_PASSWORD: ofrero
      POSTGRES_DB: ofrero
    ports:
      - "5433:5432"
    volumes:
      - ofrero-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofrero -d ofrero"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ofrero-db:
